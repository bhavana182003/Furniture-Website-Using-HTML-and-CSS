<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Furniture Rental</title>
    <link rel="stylesheet" href="styles.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script defer src="main.js"></script>
</head>
<body>
    <header>
        <a href="#" class="logo"><img src="https://www.shutterstock.com/image-vector/furniture-logo-template-260nw-372220771.jpg" alt="Business Logo"></a>
        <div class="bx bx-menu" id="menu-icon"></div>
        <ul class="navbar">
            <li><a href="#Home">Home</a></li>
            <li><a href="#Service">Services</a></li>
            <li><a href="#AvailableOnRent">Available on Rent</a></li>
            <li><a href="#About">About</a></li>
            <li><a href="#Reviews">Reviews</a></li>
        </ul>
        <div class="header-btn">
            <a href="#" class="sign-up">Sign Up</a>
            <a href="#" class="sign-in">Sign In</a>
        </div>
    </header>

    <section id="AvailableOnRent">
        <h2>Available for Rent</h2>
        <div class="furniture-container">
            <!-- Items will be added dynamically from JavaScript -->
        </div>
    </section>

    <footer>
        <p>&copy; 2024 Furniture Rental. All Rights Reserved.</p>
    </footer>
</body>
</html>
